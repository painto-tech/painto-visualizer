<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,system-ui,sans-serif;background:#F4F6F8;color:#0B1F3A}
header{background:#0B1F3A;color:#fff;padding:12px 16px;font-weight:700;font-size:18px}
header small{font-weight:400;color:#94a3b8}
.wrap{max-width:900px;margin:0 auto;padding:12px}
.gal{display:flex;gap:10px;margin:10px 0;flex-wrap:wrap}

#msg{margin:10px 0;font-weight:600;min-height:22px}

#swatches{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.sw{width:44px;height:44px;border-radius:8px;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.2);cursor:pointer;padding:0}
.sw.on{outline:3px solid #F97316}
.btn{border:0;border-radius:8px;padding:11px 16px;font-size:15px;font-weight:600;cursor:pointer;margin:4px 4px 4px 0;background:#fff;color:#0B1F3A;border:1px solid #cbd5e1}
.btn.orange{background:#F97316;color:#fff;border-color:#F97316}
.btn.red{background:#DC2626;color:#fff;border-color:#DC2626}

.tab.on{background:#F97316;color:#fff;border-color:#F97316}
#search{width:100%;padding:10px;border-radius:8px;border:1px solid #cbd5e1;font-size:15px;margin-top:8px}
</style></head>

     const pd = px.getImageData(0, 0, im.width, im.height).data, md2 = maskA.data;
     let sum = 0, cnt = 0;
     for(let i=0;i<pd.length;i+=16){ if(md2[i] > 127){ const mx = Math.max(pd[i],pd[i+1],pd[i+2]), mn = Math.min(pd[i],pd[i+1],pd[i+2]); sum += (mx+mn)/510; cnt++; } }
     maskMeanL = cnt ? sum/cnt : 0.78; }
   msg.textContent = 'Room: ' + r.label + ' — now pick a color 🎨';
   render();
  };
  mi.src = r.mask;
 };
 im.src = r.img;
}
function pickColor(c, el){
 cur = c; painted = true; showAfter = true;
 document.querySelectorAll('.sw').forEach(x=>x.classList.remove('on'));
 if(el) el.classList.add('on');
 document.getElementById('selInfo').innerHTML = c[1] + ' <small>' + c[0] + ' · ' + c[2] + '</small>';
 msg.textContent = 'Painted! Try another color, Clear, or Save 🎉';
 render();
}
let palTab = 'bs', curList = [];
function renderPalette(f){
 const w = document.getElementById('swatches');
 const q = (f||'').trim().toLowerCase();
 const src = q ? ALL : (palTab === 'bs' ? BS : ALL);
 curList = src.filter(c=>!q || c[0].toLowerCase().includes(q) || c[1].toLowerCase().includes(q));
 const shown = q ? curList.slice(0, 400) : curList;
 document.getElementById('palCount').textContent =
   q ? (curList.length + ' found' + (curList.length > 400 ? ' — showing first 400, type more to narrow' : ''))
     : (curList.length + ' colors');
 w.innerHTML = '';
 let i = 0;
 const step = () => {
  const part = shown.slice(i, i + 400);
  w.insertAdjacentHTML('beforeend', part.map((c, k) =>
   '<button class=\"sw' + (cur && cur[0]===c[0] ? ' on' : '') + '\" data-i=\"' + (i + k) +
   '\" style=\"background:' + c[2] + '\" title=\"' + c[1].replace(/\"/g,'') + ' ' + c[0] + '\"></button>').join(''));
  i += part.length;
  if(i < shown.length) requestAnimationFrame(step);
 };
 step();
}
document.getElementById('swatches').addEventListener('click', e => {
 const b = e.target.closest('.sw'); if(!b) return;
 const c = (document.getElementById('search').value.trim() ? curList.slice(0, 400) : curList)[+b.dataset.i];
 if(c) pickColor(c, b);
});
function setTab(t){
 palTab = t;
 document.getElementById('tabBs').classList.toggle('on', t === 'bs');
 document.getElementById('tabAll').classList.toggle('on', t === 'all');
 renderPalette(document.getElementById('search').value);
}
document.getElementById('tabBs').onclick = () => setTab('bs');
document.getElementById('tabAll').onclick = () => setTab('all');
document.getElementById('search').oninput = e => renderPalette(e.target.value);
document.getElementById('bBefore').onclick = () => { showAfter = false; render(); };
document.getElementById('bAfter').onclick = () => { showAfter = true; render(); };
document.getElementById('bClear').onclick = () => {
 painted = false; cur = null;
 document.querySelectorAll('.sw').forEach(x=>x.classList.remove('on'));
 document.getElementById('selInfo').textContent = 'Cleared — pick a color to paint again';
 msg.textContent = 'Cleared ✓ Pick a color to paint again';
 render();
};
document.getElementById('bCloseSave').onclick = () => { document.getElementById('saveOverlay').style.display = 'none'; };
document.getElementById('bSave').onclick = () => {
 if(!painted) return;
 const wasAfter = showAfter; showAfter = true; render();
 const url = cv.toDataURL('image/jpeg', 0.92);
 showAfter = wasAfter; render();
 if(/iphone|ipad|ipod/i.test(navigator.userAgent)){
  document.getElementById('saveImg').src = url;
  document.getElementById('saveOverlay').style.display = 'flex';
  msg.textContent = 'Press and hold the photo to save it';
  return;
 }
 const a = document.createElement('a');
 a.download = 'painto-' + (cur ? cur[0] : 'photo') + '.jpg';
 a.href = url;
 a.click();
 msg.textContent = 'Saved \u2713 Check your downloads';
};
const g = document.getElementById('gal');
g.innerHTML = '';
ROOMS.forEach((r, i) => {
 const fig = document.createElement('figure');
 const im = document.createElement('img');
 im.src = r.img; im.alt = r.label;
 im.onclick = () => pickRoom(r, im);
 const cap = document.createElement('figcaption'); cap.textContent = r.label;
 fig.appendChild(im); fig.appendChild(cap); g.appendChild(fig);
 if(i === 0) setTimeout(() => im.onclick(), 50);
});
renderPalette('');
updBtns();
</script>
